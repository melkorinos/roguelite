<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Element Card — Fire lineage · Tiers / Lineage / Levels</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  body{background:#0a0c18;color:#e8eaf4;font-family:'Space Grotesk',system-ui,sans-serif;padding:34px 28px 100px}
  h1{font-size:22px;font-weight:600;margin-bottom:6px}
  h2{font-size:15px;font-weight:600;margin:42px 0 4px;color:#dfe3f0}
  .lead{font-size:12.5px;color:#9a9cb8;max-width:900px;line-height:1.6;margin-bottom:8px}
  .lead b{color:#c8caf2;font-weight:600}
  .note{font-size:11px;color:#7a7c98;max-width:900px;line-height:1.55;margin-bottom:8px}
  .warn{color:#e0b070}
  .row{display:flex;flex-wrap:wrap;gap:30px;align-items:flex-start;margin-top:14px}
  .cell{display:flex;flex-direction:column;align-items:center;gap:8px}
  .clab{font-size:10px;letter-spacing:.5px;color:#8a8ca6;text-align:center;max-width:206px;line-height:1.4}
  .clab b{color:#dfe3f0}
  .divider{height:1px;background:#1a1d2a;margin:36px 0 0}

  .A{width:200px;height:290px;position:relative;overflow:hidden;border-radius:4px;
     padding:7px 8px 26px;display:flex;flex-direction:column}
  .rainwrap{width:206px;height:296px;border-radius:6px;padding:3px;display:flex}
  .rainwrap .A{width:200px;height:290px;border:none}
  .A .port{height:84px;border-radius:4px;position:relative;overflow:hidden;flex-shrink:0;
     display:flex;align-items:center;justify-content:center}
  .A .glowpulse{position:absolute;inset:0;pointer-events:none;mix-blend-mode:screen}
  .A .artwrap{position:relative;z-index:2;display:flex;align-items:center;justify-content:center}
  .A .name{margin-top:6px;background:rgba(0,0,0,.55);border-radius:3px;padding:4px 8px;text-align:center;
     font-family:'Fredoka One';font-size:18px;letter-spacing:1px;position:relative;overflow:hidden}
  .A .stats{margin-top:7px;display:grid;gap:5px}
  .A .pod{background:rgba(0,0,0,.45);border-radius:22px;padding:5px 0;display:flex;flex-direction:column;align-items:center}
  .A .pod .v{font-family:'Fredoka One';line-height:1.1;color:#e8eaf4}
  .A .pod .l{letter-spacing:1.3px;text-transform:uppercase;color:#9a9cb8}
  .A .pod.hl .v{color:var(--hl)}
  .A .pod.hl .l{color:var(--hl);text-decoration:underline dotted}
  .A .sep{margin-top:8px;height:1px;background:rgba(255,255,255,.07)}
  .A .ab{margin-top:6px;flex:1;display:flex;flex-direction:column;justify-content:center}
  .A .ab p{font-size:10px;color:#c8caf2;line-height:1.55}
  .A .trig{font-weight:700;color:#8fd3ff;letter-spacing:.5px;margin-right:4px}
  .A .coin{position:absolute;bottom:6px;right:8px;background:rgba(0,0,0,.6);border:1px solid rgba(235,207,115,.55);
     border-radius:10px;padding:1px 7px;font-family:'Fredoka One';font-size:12px;color:#ebcf73;z-index:9}

  .ember{position:absolute;bottom:-4px;border-radius:50%;opacity:0;pointer-events:none;z-index:3;
     animation-name:rise;animation-iteration-count:infinite;animation-timing-function:ease-out}
  @keyframes rise{0%{transform:translateY(0) scale(1);opacity:0}18%{opacity:.95}100%{transform:translateY(-78px) scale(.3);opacity:0}}
  @keyframes pulseSoft{0%,100%{opacity:.30}50%{opacity:.62}}
  @keyframes pulseHard{0%,100%{opacity:.45;transform:scale(1)}50%{opacity:.95;transform:scale(1.06)}}
  .l3halo{position:absolute;width:150px;height:150px;left:50%;top:50%;transform:translate(-50%,-50%);
     border-radius:50%;pointer-events:none;mix-blend-mode:screen;filter:blur(7px);animation:spin 5s linear infinite;z-index:1}
  @keyframes spin{to{transform:translate(-50%,-50%) rotate(360deg)}}
  .l3sweep{position:absolute;inset:0;pointer-events:none;z-index:4;
     background:linear-gradient(115deg,transparent 35%,rgba(255,255,255,.5) 50%,transparent 65%);
     transform:translateX(-120%);animation:sweep 2.8s ease-in-out infinite}
  @keyframes sweep{0%{transform:translateX(-120%)}55%,100%{transform:translateX(120%)}}
  .l3spark{position:absolute;width:7px;height:7px;pointer-events:none;z-index:5;
     background:radial-gradient(circle,#fff 0%,rgba(255,220,150,.9) 40%,transparent 70%);
     animation:twinkle 1.6s ease-in-out infinite}
  @keyframes twinkle{0%,100%{opacity:.15;transform:scale(.5)}50%{opacity:1;transform:scale(1.25)}}
  .l3art{animation:breathe 2.4s ease-in-out infinite}
  @keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
  .nameshine{position:absolute;inset:0;pointer-events:none;
     background:linear-gradient(100deg,transparent 30%,rgba(255,240,200,.85) 50%,transparent 70%);
     transform:translateX(-120%);animation:sweep 2.8s ease-in-out infinite}
</style>
</head>
<body>
  <h1>Direction A · Cartoon Epic — real fire lineage</h1>
  <p class="lead">
    Fire-descended elements at each tier: <b>Fire (T1)</b> → <b>Lava (T2 · Fire+Earth)</b> →
    <b>Volcano (T3 · Lava+Boulder)</b> → <b>Supernova (T4 · Inferno+Volcano)</b>. Real stats.
    Tiers: bronze → silver → gold → prismatic. Hue = element identity.
  </p>
  <div id="root"></div>

<script>
// ─── art (ART_ prefix so nothing collides with element data) ───
const ART_FIRE=(s)=>`<svg width="${s}" height="${s}" viewBox="0 0 68 68">
  <path d="M34 7 C28 19 17 26 17 41 C17 53 24 62 34 64 C44 62 51 53 51 41 C51 26 40 19 34 7Z" fill="#a50c04"/>
  <path d="M34 15 C29 25 22 32 22 43 C22 53 27 60 34 62 C41 60 46 53 46 43 C46 32 39 25 34 15Z" fill="#fc3e08"/>
  <path d="M34 24 C30 32 26 37 26 46 C26 53 29 58 34 59 C39 58 42 53 42 46 C42 37 38 32 34 24Z" fill="rgba(255,148,18,.95)"/>
  <path d="M34 33 C32 38 30 42 30 47 C30 51 32 54 34 55 C36 54 38 51 38 47 C38 42 36 38 34 33Z" fill="rgba(255,226,36,.9)"/>
  <path d="M34 41 C33 44 32 46 32 49 C32 52 33 54 34 54.5 C35 54 36 52 36 49 C36 46 35 44 34 41Z" fill="rgba(255,248,188,.85)"/></svg>`;
const ART_LAVA=(s)=>`<svg width="${s}" height="${s}" viewBox="0 0 68 68">
  <ellipse cx="34" cy="44" rx="25" ry="20" fill="#2a0f04"/>
  <ellipse cx="34" cy="45" rx="20" ry="15" fill="#6e2606"/>
  <path d="M14 44 C22 40 26 47 33 43 C40 39 46 47 54 42" stroke="#ff7a1e" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M18 52 C26 49 30 54 36 51 C42 48 47 53 52 50" stroke="#ffb43a" stroke-width="2" fill="none" stroke-linecap="round"/>
  <ellipse cx="30" cy="36" rx="9" ry="4.5" fill="rgba(255,150,40,.85)"/>
  <ellipse cx="30" cy="35" rx="5" ry="2.4" fill="rgba(255,222,120,.9)"/>
  <circle cx="48" cy="30" r="2" fill="rgba(255,170,60,.7)"/></svg>`;
const ART_VOLCANO=(s)=>`<svg width="${s}" height="${s}" viewBox="0 0 68 68">
  <path d="M9 58 L27 24 L41 24 L59 58 Z" fill="#241c18"/>
  <path d="M9 58 L27 24 L34 24 L20 58 Z" fill="#312622"/>
  <path d="M27 24 L41 24 L37 33 L31 33 Z" fill="#ff6a1e"/>
  <ellipse cx="34" cy="24" rx="7" ry="2.6" fill="#ffd24a"/>
  <path d="M30 33 C29 42 27 50 25 58" stroke="#ff7a28" stroke-width="2.4" fill="none" stroke-linecap="round"/>
  <path d="M38 33 C39 41 41 50 43 58" stroke="#ff9838" stroke-width="2" fill="none" stroke-linecap="round"/>
  <circle cx="34" cy="13" r="5" fill="rgba(120,110,105,.5)"/><circle cx="42" cy="9" r="4" fill="rgba(120,110,105,.4)"/>
  <circle cx="30" cy="18" r="1.8" fill="#ffd24a"/><circle cx="40" cy="16" r="1.4" fill="#ff9838"/></svg>`;
const ART_SUPERNOVA=(s)=>`<svg width="${s}" height="${s}" viewBox="0 0 68 68">
  <defs><radialGradient id="sn${s}" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#ffffff"/><stop offset="35%" stop-color="#ffe6a0"/>
    <stop offset="70%" stop-color="#ff9a3c"/><stop offset="100%" stop-color="rgba(255,120,40,0)"/></radialGradient></defs>
  <g fill="rgba(255,210,120,.6)">
   <path d="M34 2 L37 30 L31 30 Z"/><path d="M34 66 L37 38 L31 38 Z"/>
   <path d="M2 34 L30 31 L30 37 Z"/><path d="M66 34 L38 31 L38 37 Z"/>
   <path d="M12 12 L33 31 L29 35 Z"/><path d="M56 56 L35 37 L39 33 Z"/>
   <path d="M56 12 L37 33 L33 29 Z"/><path d="M12 56 L31 37 L35 41 Z"/></g>
  <circle cx="34" cy="34" r="22" fill="url(#sn${s})"/>
  <circle cx="34" cy="34" r="9" fill="#fffef2"/></svg>`;

// ─── parent hues (lineage chips) ───
const HUE={fire:"#f07020",earth:"#9c7a46",lava:"#eb5a19",boulder:"#86827a",inferno:"#dc2820",volcano:"#cd4b1e"};

// ─── elements (real stats) ───
const FIRE={label:"Fire",rgb:"240,112,32",name:"#faa050",hl:"#ff6c28",art:ART_FIRE,artSize:74,
  arch:"pure",cd:"2.5s",status:"Burn",statusVal:"1",trig:"ON FIRE",ability:"Apply 1 [burn] to opponent.",price:5};
const LAVA={label:"Lava",rgb:"235,90,25",name:"#ff9a55",hl:"#ff7a2e",art:ART_LAVA,artSize:64,
  arch:"dealer",cd:"5.0s",dmg:"5",trig:"EVERY 6s",ability:"Apply 2 [burn] to opponent.",price:8,parents:["fire","earth"]};
const VOLCANO={label:"Volcano",rgb:"205,60,28",name:"#ff8a55",hl:"#ff5a30",art:ART_VOLCANO,artSize:66,
  arch:"damage-status",cd:"6.0s",dmg:"14",status:"Burn",statusVal:"3",trig:"EVERY 6s",
  ability:"Erupt — deal [14] and apply 3 [burn].",price:12,parents:["lava","boulder"]};
const SUPERNOVA={label:"Supernova",rgb:"255,200,110",name:"#ffe6a0",hl:"#ffe6a0",art:ART_SUPERNOVA,artSize:66,
  arch:"damage-status",cd:"5.0s",dmg:"25",status:"Blind",statusVal:"2",trig:"EVERY 3 ACT.",
  ability:"Detonate: [10] dmg + 3 [burn] + 2 [blind].",price:20,parents:["inferno","volcano"]};

// ─── helpers ───
const glow=(rgb)=>`radial-gradient(ellipse at 50% 72%,rgba(${rgb},.52) 0%,rgba(${rgb},.20) 50%,rgba(8,4,2,.93) 82%),#0c0705`;
const KW={burn:"#ff6c28",blind:"#9fb4d8",armor:"#c0c8d4",freeze:"#a0e8ff"};
const kw=(t)=>t.replace(/\[([^\]]+)\]/g,(m,w)=>{const c=/^\d+$/.test(w)?"#ebcf73":(KW[w.toLowerCase()]||"#8fd3ff");return `<span style="color:${c};font-weight:600">${w}</span>`;});
function statsFor(d){
  if(d.arch==="pure")   return [{v:d.cd,l:"CD"},{v:d.statusVal,l:d.status,hl:1}];
  if(d.arch==="dealer") return [{v:d.cd,l:"CD"},{v:d.dmg,l:"DMG"}];
  return [{v:d.cd,l:"CD"},{v:d.dmg,l:"DMG"},{v:d.statusVal,l:d.status,hl:1}];
}
function metalFrame(tier,rgb){
  const M={
    1:{bw:2.5,bc:"#a8703c",ex:["inset 0 0 0 2px rgba(168,112,60,.30)"],g:.18,sp:13,off:7,bl:20},
    2:{bw:3,  bc:"#b4bac6",ex:["inset 0 0 0 2px rgba(0,0,0,.6)","inset 0 0 0 3px rgba(180,186,198,.5)"],g:.24,sp:18,off:8,bl:24},
    3:{bw:3,  bc:"#dcb653",ex:["0 0 0 2px rgba(0,0,0,.7)","0 0 0 3px rgba(220,182,83,.35)","inset 0 0 0 2px rgba(0,0,0,.6)","inset 0 0 0 4px rgba(220,182,83,.55)"],g:.30,sp:24,off:9,bl:28,gold:1},
  }[tier];
  const sh=[`inset 0 0 0 1px rgba(${rgb},.30)`,...M.ex,`0 0 ${M.sp}px rgba(${rgb},${M.g})`,
    M.gold?`0 0 16px rgba(220,182,83,.22)`:``,`0 ${M.off}px ${M.bl}px rgba(0,0,0,.85)`].filter(Boolean).join(",");
  return {border:`${M.bw}px solid ${M.bc}`,boxShadow:sh};
}
const T4PRISMATIC="conic-gradient(from 210deg,#ff5a3c,#ffd23c,#5ad24c,#3cc8ff,#9b5ade,#ff5a3c)";
function embers(n,color,dur){
  let h="";for(let i=0;i<n;i++){const left=8+Math.random()*84,d=(dur-Math.random()*.9).toFixed(2),
    dl=(-Math.random()*d).toFixed(2),sz=(2+Math.random()*2.4).toFixed(1);
    h+=`<span class="ember" style="left:${left}%;width:${sz}px;height:${sz}px;background:${color};box-shadow:0 0 5px ${color};animation-duration:${d}s;animation-delay:${dl}s"></span>`;}
  return h;
}
function lineage(parents,variant){
  const a=HUE[parents[0]]||"#888", b=HUE[parents[1]]||"#888";
  if(variant==="gems") return `<div style="position:absolute;top:6px;left:8px;z-index:10;display:flex;gap:3px;align-items:center;background:rgba(0,0,0,.55);padding:3px 5px;border-radius:8px;border:1px solid rgba(255,255,255,.08)">
     <span style="width:9px;height:9px;border-radius:50%;background:${a};box-shadow:0 0 5px ${a}"></span>
     <span style="width:9px;height:9px;border-radius:50%;background:${b};box-shadow:0 0 5px ${b}"></span></div>`;
  if(variant==="underbar") return `<div style="position:absolute;top:92px;left:9px;right:9px;height:3px;border-radius:2px;z-index:10;
     background:linear-gradient(90deg,${a} 0%,${a} 49%,${b} 51%,${b} 100%);box-shadow:0 1px 4px rgba(0,0,0,.7)"></div>`;
  if(variant==="corner") return `<div style="position:absolute;top:7px;left:8px;width:20px;height:20px;z-index:10;overflow:hidden;border-top-left-radius:4px">
     <div style="position:absolute;width:0;height:0;border-top:20px solid ${a};border-right:20px solid transparent"></div>
     <div style="position:absolute;width:0;height:0;border-top:10px solid ${b};border-right:10px solid transparent"></div></div>`;
  if(variant==="ring") return `<div style="position:absolute;top:7px;left:8px;width:184px;height:84px;border-radius:4px;z-index:8;pointer-events:none;
     background:conic-gradient(from 90deg,${a} 0deg 180deg,${b} 180deg 360deg);padding:2px;
     -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude"></div>`;
  return "";
}
function card(o){
  const d=o.el, tier=o.tier, level=o.level||1, rainbow=tier===4, hue=o.t4hue||"keyline";
  const f=rainbow?null:metalFrame(tier,d.rgb);
  const st=statsFor(d), n=st.length;
  const vSize=n===3?14:18, lSize=n===3?7.5:9;
  const bright=[1.22,1.50,1.80][level-1];
  const glowPx=[3,14,28][level-1];
  const emberN=[1,7,15][level-1];
  const emberDur=[3.6,2.5,1.6][level-1];

  let pulse="";
  if(level===2) pulse=`<div class="glowpulse" style="background:radial-gradient(circle at 50% 62%,rgba(${d.rgb},.6) 0%,transparent 62%);animation:pulseSoft 3.4s ease-in-out infinite"></div>`;
  if(level===3) pulse=`<div class="glowpulse" style="background:radial-gradient(circle at 50% 60%,rgba(${d.rgb},.85) 0%,transparent 64%);animation:pulseHard 1.9s ease-in-out infinite"></div>`;
  const l3 = level===3 ? `
    <div class="l3halo" style="background:conic-gradient(from 0deg,rgba(${d.rgb},0),rgba(255,210,110,.6),rgba(${d.rgb},0),rgba(${d.rgb},.55),rgba(${d.rgb},0))"></div>
    <div class="l3sweep"></div>
    <div class="l3spark" style="top:9px;left:14px"></div>
    <div class="l3spark" style="top:14px;right:18px;animation-delay:.5s"></div>
    <div class="l3spark" style="bottom:10px;left:26px;animation-delay:.9s"></div>
    <div class="l3spark" style="bottom:14px;right:24px;animation-delay:1.3s"></div>` : "";
  const artCls = level===3 ? "artwrap l3art" : "artwrap";
  const nameShine = level===3 ? `<span class="nameshine"></span>` : "";
  const nameColor = level===3 ? "#ffe9b0" : d.name;
  const lin = o.lineage ? lineage(d.parents,o.lineage) : "";
  const frameCss = rainbow
    ? (hue==='keyline' ? `box-shadow:inset 0 0 0 1.5px rgba(${d.rgb},.85);` : ``)
    : `border:${f.border};box-shadow:${f.boxShadow};`;

  const inner=`<div class="A" style="--hl:${d.hl};background:radial-gradient(ellipse at 50% 28%,rgba(${d.rgb},.12) 0%,transparent 62%),#0a0808;${frameCss}">
    ${lin}
    <div class="port" style="background:${glow(d.rgb)};border:1px solid rgba(${d.rgb},.42);box-shadow:inset 0 0 26px rgba(${d.rgb},.22),0 0 ${glowPx}px rgba(${d.rgb},.55);filter:brightness(${bright}) saturate(1.34)">
      ${l3}${pulse}
      <div class="${artCls}">${d.art(d.artSize)}</div>
      <div style="position:absolute;inset:0;pointer-events:none">${embers(emberN,d.hl,emberDur)}</div>
    </div>
    <div class="name" style="color:${nameColor};text-shadow:0 0 16px rgba(${d.rgb},.55)">${d.label}${nameShine}</div>
    <div class="stats" style="grid-template-columns:repeat(${n},1fr)">
      ${st.map(s=>`<div class="pod${s.hl?' hl':''}"><div class="v" style="font-size:${vSize}px">${s.v}</div><div class="l" style="font-size:${lSize}px">${s.l}</div></div>`).join("")}
    </div>
    <div class="sep"></div>
    <div class="ab"><p><span class="trig">${d.trig}</span>${kw(d.ability)}</p></div>
    <div class="coin">${d.price}g</div>
  </div>`;
  if(!rainbow) return inner;
  return `<div class="rainwrap" style="background:${T4PRISMATIC};box-shadow:0 0 26px rgba(${d.rgb},.35),0 0 30px rgba(155,90,222,.18),0 8px 30px rgba(0,0,0,.9)">${inner}</div>`;
}

const root=document.getElementById("root");
const strip=(cells)=>`<div class="row">${cells.map(c=>`<div class="cell">${c.html}<div class="clab">${c.lab}</div></div>`).join("")}</div>`;
let H="";

H+=`<h2>1 · Tier ladder — the real fire chain</h2>
<p class="note">Bronze → silver → gold → prismatic. T1 pure (2 pods) · T2 dealer · T3 erupt (3 pods) · T4 damage-status.</p>`;
H+=strip([
  {html:card({el:FIRE,tier:1}),     lab:"<b>Fire</b> · T1 bronze"},
  {html:card({el:LAVA,tier:2}),     lab:"<b>Lava</b> · T2 silver"},
  {html:card({el:VOLCANO,tier:3}),  lab:"<b>Volcano</b> · T3 gold"},
  {html:card({el:SUPERNOVA,tier:4,t4hue:"keyline"}),lab:"<b>Supernova</b> · T4 prismatic"},
]);
H+=`<p class="note" style="margin-top:18px">T4 hue mode still open — <b>keyline</b> (thin gold inner thread = identity) vs <b>fully rainbow</b> (art-only identity):</p>`;
H+=strip([
  {html:card({el:SUPERNOVA,tier:4,t4hue:"keyline"}),lab:"hue keyline"},
  {html:card({el:SUPERNOVA,tier:4,t4hue:"full"}),   lab:"fully rainbow"},
]);

H+=`<div class="divider"></div><h2>2 · “Forged-from” lineage — placement options</h2>
<p class="note">A third layer: the two immediate parents' hues. Separate from tier (metal) and identity (single hue) — watch for
<span class="warn">hue overload</span>. Volcano (Lava + Boulder) in four placements:</p>`;
H+=strip([
  {html:card({el:VOLCANO,tier:3,lineage:"gems"}),    lab:"<b>a · Gems</b> — corner chip"},
  {html:card({el:VOLCANO,tier:3,lineage:"underbar"}),lab:"<b>b · Underbar</b> — split bar"},
  {html:card({el:VOLCANO,tier:3,lineage:"corner"}),  lab:"<b>c · Corner fold</b> — slivers"},
  {html:card({el:VOLCANO,tier:3,lineage:"ring"}),    lab:"<b>d · Split ring</b> — portrait halves"},
]);
H+=`<p class="note" style="margin-top:14px">Lava (Fire + Earth) reads cleanly; Supernova (Inferno + Volcano = two reds) shows the failure mode — split ring/underbar become unreadable, favoring <b>gems</b>:</p>`;
H+=strip([
  {html:card({el:LAVA,tier:2,lineage:"gems"}),     lab:"Lava · gems"},
  {html:card({el:LAVA,tier:2,lineage:"underbar"}), lab:"Lava · underbar"},
  {html:card({el:SUPERNOVA,tier:4,t4hue:"keyline",lineage:"gems"}),lab:"Supernova · gems (2 reds)"},
]);

H+=`<div class="divider"></div><h2>3 · Levels — exaggerated separation + L3 action</h2>
<p class="note">L1 plain · L2 breathing glow + steady embers · <b>L3 = event</b> (rotating halo, shimmer sweep, sparks, flare pulse, breathing portrait, dense embers). On Lava T2.</p>
<p class="note"><span class="warn">Headroom:</span> firing animations layer on top and stay subtle — idle L3 kept from white-saturating so the fire pulse still reads.</p>`;
H+=strip([1,2,3].map(l=>({html:card({el:LAVA,tier:2,level:l}),lab:`Lava · T2 · <b>L${l}</b>${l===3?" — max":""}`})));
H+=`<p class="note" style="margin-top:18px">Apex — Supernova T4 · L3, prismatic + flourish + lineage gems:</p>`;
H+=strip([{html:card({el:SUPERNOVA,tier:4,level:3,t4hue:"keyline",lineage:"gems"}),lab:"Supernova · T4 · L3 · forged"}]);

root.innerHTML=H;
</script>
</body>
</html>
